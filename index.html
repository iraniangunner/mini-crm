<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مینی‌CRM نمایشگاه خودرو</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>مشتری‌های نمایشگاه</h1>
    <div class="actions">
      <button type="button" id="addBtn" class="btn primary">+ مشتری جدید</button>
      <button type="button" id="resetBtn" class="btn">بازگردانی داده‌ی نمونه</button>
    </div>
  </header>

  <div id="notice" class="notice" role="alert" hidden>
    <span class="notice-text"></span>
    <button type="button" class="btn small" id="noticeClose">باشه</button>
  </div>

  <section id="summary" class="summary" aria-label="خلاصه"></section>

  <section class="toolbar">
    <input id="search" type="search" placeholder="جستجوی نام یا شماره..." aria-label="جستجو">
    <label class="check"><input id="onlyOverdue" type="checkbox"> فقط عقب‌افتاده‌ها</label>
  </section>

  <!-- Mobile (< 768px) only: one tab per status; desktop shows all columns instead. -->
  <nav id="tabs" class="tabs" role="tablist" aria-label="وضعیت‌ها"></nav>

  <main id="board" class="board" aria-label="ستون‌های مشتری"></main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <dialog id="detailDialog" class="detail">
    <header class="detail-head">
      <h2 class="detail-name"></h2>
      <span class="detail-status badge"></span>
    </header>
    <dl class="detail-info"></dl>
    <h3>تاریخچه</h3>
    <form id="noteForm" class="note-form">
      <textarea name="text" rows="2" maxlength="200" placeholder="یادداشت تماس (حداکثر ۲۰۰ نویسه)..." aria-label="یادداشت"></textarea>
      <button type="submit" class="btn small primary">افزودن یادداشت</button>
    </form>
    <ol class="timeline"></ol>
    <div class="form-actions">
      <button type="button" class="btn primary" id="detailEdit">ویرایش مشخصات</button>
      <button type="button" class="btn" id="detailClose">بستن</button>
    </div>
  </dialog>

  <dialog id="customerDialog">
    <form id="customerForm" novalidate>
      <h2 id="formTitle">مشتری جدید</h2>
      <input type="hidden" name="id">

      <label class="field">
        <span>نام و نام خانوادگی <b class="req">*</b></span>
        <input name="name" type="text" autocomplete="name" maxlength="60">
        <small class="error" data-error-for="name"></small>
      </label>

      <label class="field">
        <span>شماره موبایل <b class="req">*</b></span>
        <input name="phone" type="tel" inputmode="tel" dir="ltr" placeholder="۰۹۱۲۱۲۳۴۵۶۷">
        <small class="error" data-error-for="phone"></small>
      </label>

      <label class="field">
        <span>خودروی مورد علاقه</span>
        <input name="car" type="text" maxlength="60">
      </label>

      <label class="field">
        <span>بودجه (تومان)</span>
        <input name="budget" type="text" inputmode="numeric" dir="ltr" placeholder="۲٬۵۰۰٬۰۰۰٬۰۰۰">
      </label>

      <label class="field">
        <span>منبع آشنایی</span>
        <select name="source"></select>
      </label>

      <label class="field">
        <span>تاریخ پیگیری بعدی</span>
        <input name="followUp" type="date">
        <small class="hint" id="followUpHint"></small>
      </label>

      <div class="form-actions">
        <button type="submit" class="btn primary">ذخیره</button>
        <button type="button" class="btn" id="cancelBtn">لغو</button>
      </div>
    </form>
  </dialog>

  <template id="cardTemplate">
    <article class="card" draggable="true" tabindex="0">
      <h3 class="card-name"></h3>
      <div class="card-phone" dir="ltr"></div>
      <dl class="card-info">
        <dt>خودرو</dt><dd class="card-car"></dd>
        <dt>بودجه</dt><dd class="card-budget"></dd>
        <dt>منبع</dt><dd class="card-source"></dd>
      </dl>
      <div class="card-followup"><span class="followup-date"></span> <span class="flag"></span></div>
      <div class="card-since"></div>
      <div class="card-actions">
        <select class="move-select" aria-label="انتقال به"></select>
        <button type="button" class="btn small edit-btn">ویرایش</button>
        <button type="button" class="btn small danger delete-btn">حذف</button>
      </div>
    </article>
  </template>

  <script src="js/utils.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/sample-data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
